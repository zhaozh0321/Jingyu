name: Bug report / 缺陷
description: 报告一个可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: 应用版本, placeholder: "2.2.1"}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: 设备和 Android 版本}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤, description: 请使用合成内容，不要提交 API Key 或真实对话。}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期与实际结果}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: 已脱敏的日志或截图}
